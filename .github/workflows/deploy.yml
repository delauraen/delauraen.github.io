name: Deploy to GitHub Pages

on:
  # Rebuild and deploy every time you push to master
  push:
    branches: [ master ]
  # Adds a "Run workflow" button in the Actions tab for manual deploys
  workflow_dispatch:

# Lets the job read the repo and publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4